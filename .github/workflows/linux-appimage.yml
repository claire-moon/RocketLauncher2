name: Linux AppImage

on:
  push:
    branches:
      - master
      - "linux/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - uses: actions/checkout@v5

      - run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            build-essential \
            curl \
            desktop-file-utils \
            file \
            imagemagick \
            libfuse2 \
            libgl1-mesa-dev \
            qt5-qmake \
            qtbase5-dev \
            qttools5-dev-tools \
            shellcheck \
            xvfb

      - run: |
          desktop-file-validate packaging/linux/io.github.Hypnotoad90.RocketLauncher2.desktop
          appstreamcli validate --no-net packaging/linux/io.github.Hypnotoad90.RocketLauncher2.appdata.xml
          shellcheck scripts/*.sh

      - run: scripts/build-linux.sh
      - run: scripts/build-appimage.sh
      - run: sha256sum dist/*.AppImage > dist/SHA256SUMS
      - run: |
          file build-linux/RocketLauncher2
          file dist/*.AppImage
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: RocketLauncher2-linux-x86_64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
